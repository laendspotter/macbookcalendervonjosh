<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Josh · Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080810;--surface:#10101c;--surface2:#18182a;--border:#22223a;
    --text:#e2e0ff;--muted:#5a5880;
    --acc:#7c6ff7;--acc-l:#a99fff;--acc-bg:rgba(124,111,247,.1);--acc-br:rgba(124,111,247,.3);
    --mama:#f472b6;--mama-bg:rgba(244,114,182,.08);--mama-br:rgba(244,114,182,.25);
    --high:#ff6b6b;--med:#60a5fa;--low:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes formIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

  body{font-family:'Syne Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::after{content:'';position:fixed;top:-30vh;left:-20vw;width:70vw;height:70vh;background:radial-gradient(ellipse,rgba(124,111,247,.07) 0%,transparent 70%);pointer-events:none;z-index:0;}

  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:2.5rem 1.2rem;animation:fadeUp .5s ease both;}

  /* sync */
  .sync{position:fixed;bottom:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.4rem .9rem;font-size:.62rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;z-index:300;}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--low);}
  .sdot.syn{background:var(--acc);animation:pulse 1s infinite;}
  .sdot.off{background:var(--high);}

  /* header */
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
  h1{font-family:'Syne',sans-serif;font-size:clamp(2.6rem,8vw,4.8rem);font-weight:800;line-height:.9;letter-spacing:-.04em;}
  h1 span{color:var(--acc);display:block;}
  .sub{font-size:.65rem;color:var(--muted);margin-top:.6rem;letter-spacing:.15em;text-transform:uppercase;}
  .badges{display:flex;gap:.5rem;flex-wrap:wrap;}
  .badge{padding:.3rem .85rem;border-radius:20px;font-size:.66rem;letter-spacing:.05em;}
  .badge.me{background:rgba(124,111,247,.2);color:#fff;border:1px solid var(--acc);font-weight:700;}
  .badge.bj{background:var(--acc-bg);color:var(--acc-l);border:1px solid var(--acc-br);}
  .badge.bm{background:var(--mama-bg);color:var(--mama);border:1px solid var(--mama-br);}

  /* nav */
  .nav{display:flex;align-items:center;gap:.7rem;margin-bottom:1.1rem;}
  .arr{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;touch-action:manipulation;}
  .arr:hover{border-color:var(--acc);color:var(--acc);}
  .mlabel{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;flex:1;}
  .tbtn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem .75rem;border-radius:8px;font-family:'Syne Mono',monospace;font-size:.63rem;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:border-color .15s,color .15s;touch-action:manipulation;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);}

  /* layout */
  .layout{display:grid;grid-template-columns:1fr;gap:1rem;}
  .layout.open{grid-template-columns:1fr 340px;}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.4rem;}
  .dlbl{text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;padding:.35rem 0;}
  .dcell{background:var(--surface);border:1px solid var(--border);border-radius:9px;min-height:86px;padding:.4rem;cursor:pointer;overflow:hidden;touch-action:manipulation;transition:border-color .12s,background .12s;}
  .dcell:hover,.dcell:active{border-color:var(--acc);background:var(--surface2);}
  .dcell.dim{opacity:.22;pointer-events:none;}
  .dcell.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
  .dcell.sel{border-color:var(--acc);background:var(--surface2);box-shadow:0 0 0 2px var(--acc);}
  .dnum{font-size:.68rem;color:var(--muted);margin-bottom:.2rem;font-weight:500;}
  .today .dnum,.sel .dnum{color:var(--acc-l);font-weight:700;}
  .chip{font-size:.54rem;padding:2px 4px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;}
  .chip.cj{background:var(--acc-bg);border-left:2px solid var(--acc);color:var(--acc-l);}
  .chip.cm{background:var(--mama-bg);border-left:2px solid var(--mama);color:var(--mama);}
  .pdot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
  .more{font-size:.5rem;color:var(--muted);margin-top:2px;}

  /* overlay - desktop: hidden, mobile: shown when .on */
  #overlay{display:none;position:fixed;inset:0;z-index:150;pointer-events:none;}
  #overlay.on{pointer-events:auto;}
  @media(max-width:720px){
    #overlay.on{display:block;background:rgba(0,0,0,.55);}
  }

  /* panel */
  #panel{background:var(--surface2);border:1px solid var(--acc-br);border-radius:16px;padding:1.4rem;display:none;overflow-y:auto;max-height:calc(100vh - 4rem);position:sticky;top:1rem;}
  #panel.on{display:block;}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.2rem;}
  .pdate{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--acc-l);}
  .pwd{font-size:.6rem;color:var(--muted);margin-top:3px;letter-spacing:.06em;}
  #btnClose{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:manipulation;transition:border-color .15s,color .15s;}
  #btnClose:hover{border-color:var(--acc);color:var(--acc);}

  .slbl{font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem;}
  #evList .empty{font-size:.7rem;color:var(--muted);padding:.3rem 0;}
  .pev{display:flex;gap:.65rem;align-items:flex-start;padding:.7rem .8rem;border-radius:9px;margin-bottom:.45rem;border:1px solid;}
  .pev.cj{background:var(--acc-bg);border-color:var(--acc-br);}
  .pev.cm{background:var(--mama-bg);border-color:var(--mama-br);}
  .ptime{font-size:.63rem;color:var(--muted);min-width:68px;line-height:1.6;white-space:nowrap;}
  .pinfo{flex:1;}
  .ptitle{font-size:.82rem;color:var(--text);font-weight:500;margin-bottom:2px;}
  .pwho{font-size:.6rem;}
  .pev.cj .pwho{color:var(--acc-l);}
  .pev.cm .pwho{color:var(--mama);}
  .pdel{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:.2rem;align-self:flex-start;line-height:1;touch-action:manipulation;transition:color .1s;}
  .pdel:hover{color:var(--high);}

  #btnAdd{width:100%;padding:.7rem;margin-top:.9rem;background:transparent;border:1px dashed var(--acc-br);color:var(--acc-l);border-radius:9px;font-family:'Syne Mono',monospace;font-size:.73rem;cursor:pointer;transition:background .15s,border-color .15s,border-style .15s;touch-action:manipulation;}
  #btnAdd:hover,#btnAdd:active{background:var(--acc-bg);border-style:solid;border-color:var(--acc);}

  #addForm{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);display:none;animation:formIn .2s ease both;}
  #addForm.on{display:block;}
  .ftitle{font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem;}
  .fstack{display:flex;flex-direction:column;gap:.65rem;}
  .frow label{display:block;font-size:.57rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-bottom:.28rem;}
  .frow input,.frow select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.52rem .65rem;border-radius:8px;font-family:'Syne Mono',monospace;font-size:.76rem;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none;}
  .frow input:focus,.frow select:focus{border-color:var(--acc);}
  .tworow{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;}
  .prios{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
  .pr{padding:.48rem .1rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne Mono',monospace;font-size:.6rem;cursor:pointer;text-align:center;transition:all .15s;touch-action:manipulation;}
  .pr.on.h{background:rgba(255,107,107,.12);border-color:var(--high);color:var(--high);}
  .pr.on.m{background:rgba(96,165,250,.12);border-color:var(--med);color:var(--med);}
  .pr.on.l{background:rgba(52,211,153,.12);border-color:var(--low);color:var(--low);}
  .fbtns{display:flex;gap:.55rem;margin-top:.7rem;}
  #btnCancel{flex:1;padding:.68rem;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-family:'Syne Mono',monospace;font-size:.68rem;cursor:pointer;touch-action:manipulation;}
  #btnSave{flex:2;padding:.68rem;background:var(--acc);border:none;color:#fff;border-radius:9px;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;touch-action:manipulation;}
  #btnSave:active{opacity:.85;}

  /* bottom */
  .bottom{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:1.1rem;}
  .card h3{font-size:.6rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.85rem;font-family:'Syne',sans-serif;}
  .uitem{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--border);}
  .uitem:last-child{border-bottom:none;}
  .udt{font-size:.6rem;color:var(--muted);min-width:52px;line-height:1.5;}
  .utitle{font-size:.76rem;color:var(--text);}
  .utime{font-size:.6rem;margin-top:1px;}
  .conf{display:flex;gap:.6rem;align-items:center;padding:.5rem .7rem;background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.15);border-radius:8px;margin-bottom:.45rem;font-size:.66rem;color:var(--high);}
  .empty2{font-size:.68rem;color:var(--muted);}

  /* MOBILE */
  @media(max-width:720px){
    .wrap{padding:1rem .75rem 5rem;}
    header{margin-bottom:1rem;}
    h1{font-size:2rem;}
    .badges{display:none;}
    .nav{gap:.4rem;margin-bottom:.7rem;}
    .mlabel{font-size:.88rem;}
    .arr{width:32px;height:32px;font-size:.8rem;}
    .tbtn{font-size:.58rem;padding:.28rem .55rem;}
    .grid{gap:2px;}
    .dlbl{font-size:.5rem;padding:.28rem 0;}
    .dcell{min-height:52px;padding:.28rem;border-radius:6px;}
    .dnum{font-size:.65rem;}
    .chip{font-size:.48rem;padding:1px 3px;}
    .more{font-size:.44rem;}
    .bottom{grid-template-columns:1fr;gap:.55rem;}
    .card{padding:.85rem;}

    .layout.open{grid-template-columns:1fr;}
    #panel{
      position:fixed !important;
      inset:auto 0 0 0 !important;
      width:100% !important;
      max-height:83vh !important;
      border-radius:18px 18px 0 0 !important;
      z-index:200 !important;
      overflow-y:auto !important;
      -webkit-overflow-scrolling:touch;
      padding:.4rem 1rem 2.5rem !important;
      border:1px solid var(--acc-br) !important;
      border-bottom:none !important;
      animation:slideUp .28s ease both !important;
    }
    #panel.on{display:block !important;}
    .handle{display:block !important;}

    .pdate{font-size:.98rem;}
    #btnClose{width:36px;height:36px;}
    .pev{padding:.58rem .65rem;}
    .ptitle{font-size:.78rem;}
    .ptime{font-size:.6rem;min-width:58px;}
    #btnAdd{padding:.65rem;font-size:.7rem;margin-top:.75rem;}
    .frow input,.frow select{font-size:16px !important;}
    .pr{font-size:.56rem;padding:.48rem .05rem;}
    .fbtns{gap:.45rem;}
    #btnCancel,#btnSave{padding:.72rem;font-size:.72rem;}
  }
</style>
</head>
<body>

<div class="sync" id="sync"><div class="sdot syn" id="sdot"></div><span id="stxt">verbinde...</span></div>
<div id="overlay"></div>

<div class="wrap">
  <header>
    <div>
      <h1>JOSH<span>.</span></h1>
      <p class="sub">macbook kalender · deine einträge</p>
    </div>
    <div class="badges">
      <span class="badge me">● du</span>
      <span class="badge bj">josh</span>
      <span class="badge bm">mama</span>
    </div>
  </header>

  <div class="nav">
    <button class="arr" id="btnPrev">◀</button>
    <button class="arr" id="btnNext">▶</button>
    <span class="mlabel" id="mlabel"></span>
    <button class="tbtn" id="btnToday">heute</button>
  </div>

  <div class="layout" id="layout">
    <div>
      <div class="grid" id="grid">
        <div class="dlbl">Mo</div><div class="dlbl">Di</div><div class="dlbl">Mi</div>
        <div class="dlbl">Do</div><div class="dlbl">Fr</div><div class="dlbl">Sa</div><div class="dlbl">So</div>
      </div>
      <div class="bottom">
        <div class="card"><h3>⚡ konflikte</h3><div id="confl"><p class="empty2">keine 🎉</p></div></div>
        <div class="card"><h3>📅 nächste termine</h3><div id="upc"><p class="empty2">noch nichts</p></div></div>
      </div>
    </div>

    <div id="panel">
      <div class="handle" style="display:none;width:38px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto .9rem;"></div>
      <div class="phead">
        <div><div class="pdate" id="pdate">–</div><div class="pwd" id="pwd"></div></div>
        <button id="btnClose">✕</button>
      </div>
      <div class="slbl">einträge an diesem tag</div>
      <div id="evList"><p class="empty">noch nichts geplant ✨</p></div>
      <button id="btnAdd">+ eintrag hinzufügen</button>
      <div id="addForm">
        <div class="ftitle">neuer eintrag</div>
        <div class="fstack">
          <div class="frow"><label>was machst du?</label><input type="text" id="ftitle" placeholder="z.b. gaming, zoom..." autocomplete="off"></div>
          <div class="frow tworow">
            <div><label>von</label><input type="time" id="ffrom" value="09:00"></div>
            <div><label>bis</label><input type="time" id="fto" value="10:00"></div>
          </div>
          <div class="frow">
            <label>priorität</label>
            <div class="prios">
              <button class="pr h on" data-p="high">🔴 dringend</button>
              <button class="pr m" data-p="med">🔵 normal</button>
              <button class="pr l" data-p="low">🟢 easy</button>
            </div>
          </div>
          <div class="fbtns">
            <button id="btnCancel">abbrechen</button>
            <button id="btnSave">eintragen ✓</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCSVAnfWbMkmh8iExGit9VPiXyH7u0RuQ4",
  authDomain:"macbookcalender.firebaseapp.com",
  databaseURL:"https://macbookcalender-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"macbookcalender",
  storageBucket:"macbookcalender.firebasestorage.app",
  messagingSenderId:"343397183596",
  appId:"1:343397183596:web:12e6bc9f83ee3dcdd9e849"
});
const db = getDatabase(app);
const evRef = ref(db, 'events');

const ME = 'josh';
const now = new Date();
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MO = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const PC = {high:'#ff6b6b', med:'#60a5fa', low:'#34d399'};
const PL = {high:'🔴 dringend', med:'🔵 normal', low:'🟢 easy'};

let yr = now.getFullYear(), mo = now.getMonth();
let selDate = null, curPrio = 'high', evs = {};

// DOM refs
const $ = id => document.getElementById(id);
const grid = $('grid');

// SYNC
function setSyn(s) {
  $('sdot').className = 'sdot' + (s==='syn'?' syn':s==='off'?' off':'');
  $('stxt').textContent = s==='syn'?'syncing...':s==='off'?'offline':'live ✓';
}

// FIREBASE
onValue(evRef, snap => { evs = snap.val()||{}; setSyn('ok'); render(); if(selDate) renderPanel(selDate); }, ()=>setSyn('off'));

// HELPERS
function dk(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function allEvs(){ return Object.entries(evs).map(([id,e])=>({id,...e})); }

// RENDER CALENDAR
function render(){
  const labels = [...grid.querySelectorAll('.dlbl')];
  grid.innerHTML = '';
  labels.forEach(l=>grid.appendChild(l));
  const first = new Date(yr,mo,1), last = new Date(yr,mo+1,0);
  let off = first.getDay()-1; if(off<0) off=6;
  for(let i=off-1;i>=0;i--) grid.appendChild(mkCell(new Date(yr,mo,-i), true));
  for(let d=1;d<=last.getDate();d++) grid.appendChild(mkCell(new Date(yr,mo,d), false));
  const tot=off+last.getDate(), rem=tot%7===0?0:7-(tot%7);
  for(let d=1;d<=rem;d++) grid.appendChild(mkCell(new Date(yr,mo+1,d), true));
  $('mlabel').textContent = MONTHS[mo]+' '+yr;
  renderConf(); renderUpc();
}

function mkCell(date, dim){
  const c = document.createElement('div');
  c.className = 'dcell'+(dim?' dim':'');
  const key = dk(date);
  if(key===dk(now)) c.classList.add('today');
  if(selDate && key===dk(selDate)) c.classList.add('sel');
  const n = document.createElement('div'); n.className='dnum'; n.textContent=date.getDate(); c.appendChild(n);
  const dayEvs = allEvs().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  dayEvs.slice(0,2).forEach(ev=>{
    const ch = document.createElement('div');
    ch.className = 'chip '+(ev.user===ME?'cj':'cm');
    ch.innerHTML = `<span class="pdot" style="background:${PC[ev.prio]}"></span>${ev.from} ${ev.title}`;
    c.appendChild(ch);
  });
  if(dayEvs.length>2){ const m=document.createElement('div'); m.className='more'; m.textContent=`+${dayEvs.length-2} mehr`; c.appendChild(m); }
  c.addEventListener('click', ()=>openDay(date));
  return c;
}

// PANEL OPEN/CLOSE
function openDay(date){
  selDate = date;
  closeForm(false);
  $('layout').classList.add('open');
  $('panel').classList.add('on');
  $('overlay').classList.add('on');
  renderPanel(date);
  render();
}

function closePanel(){
  selDate = null;
  $('layout').classList.remove('open');
  $('panel').classList.remove('on');
  $('overlay').classList.remove('on');
  closeForm(false);
  render();
}

function openForm(){
  $('addForm').classList.add('on');
  $('btnAdd').textContent = '✕ abbrechen';
  $('ftitle').value = '';
  $('ffrom').value = '09:00';
  $('fto').value = '10:00';
  setPrio('high');
  setTimeout(()=>$('ftitle').focus(), 80);
}

function closeForm(resetBtn=true){
  $('addForm').classList.remove('on');
  if(resetBtn) $('btnAdd').textContent = '+ eintrag hinzufügen';
}

// PANEL CONTENT
function renderPanel(date){
  const key = dk(date);
  const dayEvs = allEvs().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  $('pdate').textContent = date.getDate()+'. '+MO[date.getMonth()];
  $('pwd').textContent = WD[date.getDay()];
  const el = $('evList');
  if(!dayEvs.length){ el.innerHTML='<p class="empty">noch nichts geplant ✨</p>'; return; }
  el.innerHTML = dayEvs.map(ev=>`
    <div class="pev ${ev.user===ME?'cj':'cm'}">
      <div class="ptime">${ev.from}–${ev.to}</div>
      <div class="pinfo">
        <div class="ptitle">${ev.title}</div>
        <div class="pwho">${ev.user===ME?'🎮 josh':'👩 mama'} · ${PL[ev.prio]}</div>
      </div>
      ${ev.user===ME?`<button class="pdel" data-id="${ev.id}">✕</button>`:''}
    </div>`).join('');
  // attach delete listeners
  el.querySelectorAll('.pdel').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      setSyn('syn');
      await remove(ref(db,'events/'+btn.dataset.id));
    });
  });
}

// PRIO
function setPrio(p){
  curPrio = p;
  document.querySelectorAll('.pr').forEach(b=>{
    const bp = b.dataset.p;
    b.classList.toggle('on', bp===p);
    b.classList.toggle('h', bp==='high');
    b.classList.toggle('m', bp==='med');
    b.classList.toggle('l', bp==='low');
    if(bp!==p){ b.classList.remove('h','m','l'); b.classList.add(bp==='high'?'h':bp==='med'?'m':'l'); }
  });
}

// SAVE
async function saveEv(){
  const t = $('ftitle').value.trim();
  if(!t||!selDate){ $('ftitle').focus(); return; }
  setSyn('syn');
  await push(evRef, { date:dk(selDate), user:ME, title:t, from:$('ffrom').value, to:$('fto').value, prio:curPrio });
  closeForm();
}

// CONFLICTS
function renderConf(){
  const el=$('confl');
  const ws=new Date(now); ws.setDate(now.getDate()-now.getDay()+1);
  const we=new Date(ws); we.setDate(ws.getDate()+6);
  const wevs=allEvs().filter(e=>{const d=new Date(e.date);return d>=ws&&d<=we;});
  const cs=[];
  for(let i=0;i<wevs.length;i++) for(let j=i+1;j<wevs.length;j++){
    const a=wevs[i],b=wevs[j];
    if(a.date===b.date&&a.user!==b.user&&a.from<b.to&&a.to>b.from) cs.push({a,b});
  }
  el.innerHTML = cs.length ? cs.map(({a,b})=>`<div class="conf">⚠️ ${a.date.slice(8)}. · ${a.from}–${a.to} vs ${b.from}–${b.to}</div>`).join('') : '<p class="empty2">keine 🎉</p>';
}

// UPCOMING
function renderUpc(){
  const el=$('upc'), tk=dk(now);
  const up=allEvs().filter(e=>e.date>=tk).sort((a,b)=>a.date.localeCompare(b.date)||a.from.localeCompare(b.from)).slice(0,5);
  if(!up.length){el.innerHTML='<p class="empty2">noch nichts</p>';return;}
  el.innerHTML=up.map(ev=>{
    const[y,m,d]=ev.date.split('-');
    const ds=new Date(+y,+m-1,+d).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
    const col=ev.user===ME?'var(--acc-l)':'var(--mama)';
    return `<div class="uitem"><div class="udt">${ds}</div><div><div class="utitle">${ev.title}</div><div class="utime" style="color:${col}">${ev.user} · ${ev.from}–${ev.to}</div></div></div>`;
  }).join('');
}

// ALL EVENT LISTENERS — no inline onclick
$('btnPrev').addEventListener('click', ()=>{ mo--; if(mo<0){mo=11;yr--;} render(); });
$('btnNext').addEventListener('click', ()=>{ mo++; if(mo>11){mo=0;yr++;} render(); });
$('btnToday').addEventListener('click', ()=>{ yr=now.getFullYear(); mo=now.getMonth(); render(); });
$('btnClose').addEventListener('click', closePanel);
$('overlay').addEventListener('click', closePanel);
$('btnAdd').addEventListener('click', ()=>{ if($('addForm').classList.contains('on')) closeForm(); else openForm(); });
$('btnCancel').addEventListener('click', closeForm);
$('btnSave').addEventListener('click', saveEv);
document.querySelectorAll('.pr').forEach(b=>{ b.addEventListener('click', ()=>setPrio(b.dataset.p)); });
</script>
</body>
