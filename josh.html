<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Josh · MacBook Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080810; --surface:#10101c; --surface2:#18182a; --border:#22223a;
    --text:#e2e0ff; --muted:#5a5880;
    --acc:#7c6ff7; --acc-light:#a99fff; --acc-bg:rgba(124,111,247,0.1); --acc-border:rgba(124,111,247,0.3);
    --mama:#f472b6; --mama-bg:rgba(244,114,182,0.08); --mama-border:rgba(244,114,182,0.25);
    --high:#ff6b6b; --med:#60a5fa; --low:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes formDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  body{font-family:'Syne Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::after{content:'';position:fixed;top:-30vh;left:-20vw;width:70vw;height:70vh;background:radial-gradient(ellipse,rgba(124,111,247,0.08) 0%,transparent 70%);pointer-events:none;z-index:0;}

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:2.5rem 1.2rem;animation:fadeUp 0.5s ease both;}

  .sync-pill{position:fixed;bottom:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.4rem 0.9rem;font-size:0.62rem;color:var(--muted);display:flex;align-items:center;gap:0.4rem;z-index:50;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--low);}
  .sync-dot.syncing{background:var(--acc);animation:pulse 1s infinite;}
  .sync-dot.offline{background:var(--high);}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
  h1{font-family:'Syne',sans-serif;font-size:clamp(2.8rem,8vw,5rem);font-weight:800;line-height:0.9;letter-spacing:-0.04em;}
  h1 .accent{color:var(--acc);display:block;}
  .subtitle{font-size:0.65rem;color:var(--muted);margin-top:0.6rem;letter-spacing:0.15em;text-transform:uppercase;}
  .who-strip{display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;}
  .badge{padding:0.35rem 0.9rem;border-radius:20px;font-size:0.68rem;letter-spacing:0.06em;font-family:'Syne Mono',monospace;}
  .badge.me{background:rgba(124,111,247,0.2);color:#fff;border:1px solid var(--acc);font-weight:700;}
  .badge.b-josh{background:var(--acc-bg);color:var(--acc-light);border:1px solid var(--acc-border);}
  .badge.b-mama{background:var(--mama-bg);color:var(--mama);border:1px solid var(--mama-border);}

  .nav{display:flex;align-items:center;gap:0.8rem;margin-bottom:1.2rem;}
  .nav-arrow{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
  .nav-arrow:hover{border-color:var(--acc);color:var(--acc);}
  .month-label{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:-0.01em;flex:1;}
  .today-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.8rem;border-radius:8px;font-family:'Syne Mono',monospace;font-size:0.65rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
  .today-btn:hover{border-color:var(--acc);color:var(--acc);}

  /* desktop two-col */
  .main-layout{display:grid;grid-template-columns:1fr;gap:1rem;}
  .main-layout.panel-open{grid-template-columns:1fr 340px;}

  /* CALENDAR */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.5rem;}
  .day-label{text-align:center;font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;padding:0.4rem 0;}
  .day-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:88px;padding:0.45rem;cursor:pointer;transition:border-color 0.15s,background 0.15s;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  .day-cell:active{background:var(--surface2);}
  .day-cell.other-month{opacity:0.25;pointer-events:none;}
  .day-cell.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
  .day-cell.selected{border-color:var(--acc);background:var(--surface2);box-shadow:0 0 0 2px var(--acc);}
  .day-num{font-size:0.7rem;color:var(--muted);margin-bottom:0.25rem;font-weight:500;}
  .today .day-num{color:var(--acc-light);font-weight:700;}
  .selected .day-num{color:var(--acc-light);}
  .event-chip{font-size:0.56rem;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;}
  .event-chip.ev-josh{background:var(--acc-bg);border-left:2px solid var(--acc);color:var(--acc-light);}
  .event-chip.ev-mama{background:var(--mama-bg);border-left:2px solid var(--mama);color:var(--mama);}
  .prio-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
  .more-chip{font-size:0.52rem;color:var(--muted);margin-top:2px;}

  /* OVERLAY — simple dark bg, no blur */
  .panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;}
  .panel-overlay.visible{display:block;}

  /* DAY PANEL — desktop sidebar */
  .day-panel{background:var(--surface2);border:1px solid var(--acc-border);border-radius:18px;padding:1.4rem;box-shadow:0 0 50px rgba(124,111,247,0.12);display:none;overflow-y:auto;max-height:calc(100vh - 4rem);position:sticky;top:1rem;}
  .day-panel.visible{display:block;}

  .panel-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.3rem;}
  .panel-date{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;color:var(--acc-light);letter-spacing:-0.02em;}
  .panel-weekday{font-size:0.62rem;color:var(--muted);margin-top:3px;letter-spacing:0.06em;}
  .panel-close{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
  .panel-close:hover{border-color:var(--acc);color:var(--acc);}

  .section-lbl{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.8rem;}

  .panel-event{display:flex;gap:0.7rem;align-items:flex-start;padding:0.75rem 0.85rem;border-radius:10px;margin-bottom:0.5rem;border:1px solid;}
  .panel-event.ev-josh{background:var(--acc-bg);border-color:var(--acc-border);}
  .panel-event.ev-mama{background:var(--mama-bg);border-color:var(--mama-border);}
  .ev-time{font-size:0.65rem;color:var(--muted);min-width:72px;line-height:1.6;white-space:nowrap;}
  .ev-info{flex:1;}
  .ev-title{font-size:0.85rem;color:var(--text);font-weight:500;margin-bottom:3px;}
  .ev-who{font-size:0.62rem;}
  .panel-event.ev-josh .ev-who{color:var(--acc-light);}
  .panel-event.ev-mama .ev-who{color:var(--mama);}
  .ev-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0.25rem;transition:color 0.1s;align-self:flex-start;line-height:1;-webkit-tap-highlight-color:transparent;}
  .ev-del:hover{color:var(--high);}
  .no-events{font-size:0.72rem;color:var(--muted);padding:0.3rem 0;}

  .btn-show-form{width:100%;padding:0.75rem;margin-top:1rem;background:transparent;border:1px dashed var(--acc-border);color:var(--acc-light);border-radius:10px;font-family:'Syne Mono',monospace;font-size:0.75rem;cursor:pointer;transition:all 0.15s;letter-spacing:0.04em;-webkit-tap-highlight-color:transparent;}
  .btn-show-form:hover,.btn-show-form:active{background:var(--acc-bg);border-style:solid;border-color:var(--acc);}

  .panel-form{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:none;animation:formDown 0.2s ease both;}
  .panel-form.visible{display:block;}
  .form-lbl-title{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.8rem;}
  .fields{display:flex;flex-direction:column;gap:0.7rem;}
  .f-row label{display:block;font-size:0.58rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.3rem;}
  .f-row input,.f-row select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.55rem 0.7rem;border-radius:8px;font-family:'Syne Mono',monospace;font-size:0.78rem;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
  .f-row input:focus,.f-row select:focus{border-color:var(--acc);}
  .time-row{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}
  .prio-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.4rem;}
  .prio-btn{padding:0.5rem 0.2rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne Mono',monospace;font-size:0.62rem;cursor:pointer;transition:all 0.15s;text-align:center;-webkit-tap-highlight-color:transparent;}
  .prio-btn.active.high{background:rgba(255,107,107,0.12);border-color:var(--high);color:var(--high);}
  .prio-btn.active.med{background:rgba(96,165,250,0.12);border-color:var(--med);color:var(--med);}
  .prio-btn.active.low{background:rgba(52,211,153,0.12);border-color:var(--low);color:var(--low);}
  .form-btns{display:flex;gap:0.6rem;margin-top:0.8rem;}
  .btn-cancel{flex:1;padding:0.7rem;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;font-family:'Syne Mono',monospace;font-size:0.7rem;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .btn-save{flex:2;padding:0.7rem;background:var(--acc);border:none;color:#fff;border-radius:10px;font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .btn-save:active{opacity:0.85;}

  /* bottom cards */
  .bottom-section{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:0.5rem;}
  .section-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem;}
  .section-card h3{font-size:0.62rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.9rem;font-family:'Syne',sans-serif;}
  .upcoming-item{display:flex;gap:0.7rem;align-items:flex-start;padding:0.55rem 0;border-bottom:1px solid var(--border);}
  .upcoming-item:last-child{border-bottom:none;}
  .up-date{font-size:0.62rem;color:var(--muted);min-width:55px;line-height:1.5;}
  .up-title{font-size:0.78rem;color:var(--text);}
  .up-time{font-size:0.62rem;margin-top:1px;}
  .conflict-item{display:flex;gap:0.7rem;align-items:center;padding:0.55rem 0.75rem;background:rgba(255,107,107,0.06);border:1px solid rgba(255,107,107,0.15);border-radius:8px;margin-bottom:0.5rem;font-size:0.68rem;color:var(--high);}
  .no-data{font-size:0.7rem;color:var(--muted);}

  /* ===== MOBILE ===== */
  @media(max-width:720px){
    .app{padding:1rem 0.75rem 5rem;}
    header{margin-bottom:1rem;}
    h1{font-size:2.2rem;}
    .who-strip{display:none;}
    .nav{gap:0.5rem;margin-bottom:0.8rem;}
    .month-label{font-size:0.9rem;}
    .nav-arrow{width:34px;height:34px;}
    .today-btn{font-size:0.6rem;padding:0.3rem 0.6rem;}
    .cal-grid{gap:2px;}
    .day-label{font-size:0.52rem;padding:0.3rem 0;}
    .day-cell{min-height:54px;padding:0.3rem;border-radius:7px;}
    .day-num{font-size:0.68rem;}
    .event-chip{font-size:0.5rem;padding:1px 3px;}
    .more-chip{font-size:0.46rem;}
    .bottom-section{grid-template-columns:1fr;gap:0.6rem;}
    .section-card{padding:0.9rem;}

    /* overlay */
    .panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;}
    .panel-overlay.visible{display:block;}

    /* panel as bottom sheet */
    .main-layout.panel-open{grid-template-columns:1fr;}
    .day-panel{
      position:fixed !important;
      bottom:0 !important; left:0 !important; right:0 !important; top:auto !important;
      width:100% !important; max-height:82vh !important;
      border-radius:20px 20px 0 0 !important;
      z-index:200 !important;
      overflow-y:auto !important;
      -webkit-overflow-scrolling:touch;
      padding:0.5rem 1rem 2rem !important;
      border-left:none !important; border-right:none !important; border-bottom:none !important;
      animation:slideUp 0.3s ease both !important;
    }
    .day-panel.visible{display:block !important;}

    /* drag handle */
    .drag-handle{display:block !important;}

    .panel-date{font-size:1rem;}
    .panel-close{width:34px;height:34px;}
    .panel-event{padding:0.6rem 0.7rem;}
    .ev-title{font-size:0.8rem;}
    .ev-time{font-size:0.6rem;min-width:60px;}
    .btn-show-form{padding:0.7rem;font-size:0.72rem;margin-top:0.8rem;}
    /* prevent zoom on input focus ios */
    .f-row input,.f-row select{font-size:16px !important;}
    .prio-btn{font-size:0.58rem;padding:0.5rem 0.1rem;}
    .form-btns{gap:0.5rem;}
    .btn-cancel,.btn-save{padding:0.75rem;font-size:0.75rem;}
  }
</style>
</head>
<body>

<div class="sync-pill">
  <div class="sync-dot syncing" id="syncDot"></div>
  <span id="syncText">verbinde...</span>
</div>

<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<div class="app">
  <header>
    <div>
      <h1>JOSH<span class="accent">.</span></h1>
      <p class="subtitle">macbook kalender · deine einträge</p>
    </div>
    <div class="who-strip">
      <div class="badge me">● du</div>
      <div class="badge b-josh">josh</div>
      <div class="badge b-mama">mama</div>
    </div>
  </header>

  <div class="nav">
    <button class="nav-arrow" id="prevMonth">◀</button>
    <button class="nav-arrow" id="nextMonth">▶</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="today-btn" id="todayBtn">heute</button>
  </div>

  <div class="main-layout" id="mainLayout">
    <div>
      <div class="cal-grid" id="calGrid">
        <div class="day-label">Mo</div><div class="day-label">Di</div><div class="day-label">Mi</div>
        <div class="day-label">Do</div><div class="day-label">Fr</div><div class="day-label">Sa</div><div class="day-label">So</div>
      </div>
      <div class="bottom-section">
        <div class="section-card"><h3>⚡ konflikte diese woche</h3><div id="conflictList"><p class="no-data">keine 🎉</p></div></div>
        <div class="section-card"><h3>📅 nächste termine</h3><div id="upcomingList"><p class="no-data">noch nichts</p></div></div>
      </div>
    </div>

    <div class="day-panel" id="dayPanel">
      <div class="drag-handle" style="display:none;width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 1rem;"></div>
      <div class="panel-header">
        <div>
          <div class="panel-date" id="panelDate">–</div>
          <div class="panel-weekday" id="panelWeekday"></div>
        </div>
        <button class="panel-close" onclick="closePanel()">✕</button>
      </div>

      <div class="section-lbl">einträge</div>
      <div id="panelEventList"><p class="no-events">noch nichts geplant ✨</p></div>

      <button class="btn-show-form" id="btnShowForm" onclick="toggleForm()">+ eintrag hinzufügen</button>

      <div class="panel-form" id="panelForm">
        <div class="form-lbl-title">neuer eintrag</div>
        <div class="fields">
          <div class="f-row">
            <label>was machst du?</label>
            <input type="text" id="pTitle" placeholder="z.b. gaming, zoom call..." autocomplete="off">
          </div>
          <div class="f-row time-row">
            <div><label>von</label><input type="time" id="pFrom" value="09:00"></div>
            <div><label>bis</label><input type="time" id="pTo" value="10:00"></div>
          </div>
          <div class="f-row">
            <label>priorität</label>
            <div class="prio-row">
              <button class="prio-btn high active" id="prioHigh" onclick="setPrio('high')">🔴 dringend</button>
              <button class="prio-btn med" id="prioMed" onclick="setPrio('med')">🔵 normal</button>
              <button class="prio-btn low" id="prioLow" onclick="setPrio('low')">🟢 easy</button>
            </div>
          </div>
          <div class="form-btns">
            <button class="btn-cancel" onclick="toggleForm()">abbrechen</button>
            <button class="btn-save" onclick="saveEvent()">eintragen ✓</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCSVAnfWbMkmh8iExGit9VPiXyH7u0RuQ4",
  authDomain:"macbookcalender.firebaseapp.com",
  databaseURL:"https://macbookcalender-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"macbookcalender",
  storageBucket:"macbookcalender.firebasestorage.app",
  messagingSenderId:"343397183596",
  appId:"1:343397183596:web:12e6bc9f83ee3dcdd9e849"
});
const db = getDatabase(app);
const evRef = ref(db,'events');

const ME='josh', now=new Date();
let yr=now.getFullYear(), mo=now.getMonth(), selDate=null, prio='high', events={};
const prioC={high:'#ff6b6b',med:'#60a5fa',low:'#34d399'};
const prioL={high:'🔴 dringend',med:'🔵 normal',low:'🟢 easy'};
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function dk(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function list(){return Object.entries(events).map(([id,ev])=>({id,...ev}));}

function sync(s){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncText');
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='offline'?' offline':'');
  txt.textContent=s==='syncing'?'syncing...':s==='offline'?'offline':'live ✓';
}

onValue(evRef,snap=>{events=snap.val()||{};sync('online');render();if(selDate)renderPanel(selDate);},()=>sync('offline'));

function render(){
  const g=document.getElementById('calGrid');
  const labels=[...g.querySelectorAll('.day-label')];
  g.innerHTML=''; labels.forEach(l=>g.appendChild(l));
  const first=new Date(yr,mo,1), last=new Date(yr,mo+1,0);
  let off=first.getDay()-1; if(off<0)off=6;
  for(let i=off-1;i>=0;i--) g.appendChild(cell(new Date(yr,mo,-i),true));
  for(let d=1;d<=last.getDate();d++) g.appendChild(cell(new Date(yr,mo,d),false));
  const tot=off+last.getDate(), rem=tot%7===0?0:7-(tot%7);
  for(let d=1;d<=rem;d++) g.appendChild(cell(new Date(yr,mo+1,d),true));
  document.getElementById('monthLabel').textContent=MONTHS[mo]+' '+yr;
  renderConflicts(); renderUpcoming();
}

function cell(date,other){
  const c=document.createElement('div');
  c.className='day-cell'+(other?' other-month':'');
  const key=dk(date);
  if(key===dk(now)) c.classList.add('today');
  if(selDate&&key===dk(selDate)) c.classList.add('selected');
  const n=document.createElement('div'); n.className='day-num'; n.textContent=date.getDate(); c.appendChild(n);
  const evs=list().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  evs.slice(0,2).forEach(ev=>{
    const ch=document.createElement('div');
    ch.className='event-chip ev-'+(ev.user===ME?'josh':'mama');
    ch.innerHTML=`<span class="prio-dot" style="background:${prioC[ev.prio]}"></span>${ev.from} ${ev.title}`;
    c.appendChild(ch);
  });
  if(evs.length>2){const m=document.createElement('div');m.className='more-chip';m.textContent=`+${evs.length-2} mehr`;c.appendChild(m);}
  c.onclick=()=>openDay(date);
  return c;
}

function openDay(date){
  selDate=date;
  document.getElementById('panelForm').classList.remove('visible');
  document.getElementById('btnShowForm').textContent='+ eintrag hinzufügen';
  document.getElementById('mainLayout').classList.add('panel-open');
  document.getElementById('dayPanel').classList.add('visible');
  document.getElementById('panelOverlay').classList.add('visible');
  renderPanel(date); render();
}

window.closePanel=()=>{
  selDate=null;
  document.getElementById('mainLayout').classList.remove('panel-open');
  document.getElementById('dayPanel').classList.remove('visible');
  document.getElementById('panelOverlay').classList.remove('visible');
  document.getElementById('panelForm').classList.remove('visible');
  render();
};

window.toggleForm=()=>{
  const f=document.getElementById('panelForm'), b=document.getElementById('btnShowForm');
  const open=f.classList.toggle('visible');
  b.textContent=open?'✕ abbrechen':'+ eintrag hinzufügen';
  if(open){
    document.getElementById('pTitle').value='';
    document.getElementById('pFrom').value='09:00';
    document.getElementById('pTo').value='10:00';
    window.setPrio('high');
    setTimeout(()=>document.getElementById('pTitle').focus(),100);
  }
};

function renderPanel(date){
  const key=dk(date);
  const evs=list().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  document.getElementById('panelDate').textContent=date.getDate()+'. '+MO[date.getMonth()];
  document.getElementById('panelWeekday').textContent=WD[date.getDay()];
  const el=document.getElementById('panelEventList');
  if(!evs.length){el.innerHTML='<p class="no-events">noch nichts geplant ✨</p>';return;}
  el.innerHTML=evs.map(ev=>`
    <div class="panel-event ev-${ev.user===ME?'josh':'mama'}">
      <div class="ev-time">${ev.from}–${ev.to}</div>
      <div class="ev-info">
        <div class="ev-title">${ev.title}</div>
        <div class="ev-who">${ev.user==='josh'?'🎮 josh':'👩 mama'} · ${prioL[ev.prio]}</div>
      </div>
      ${ev.user===ME?`<button class="ev-del" onclick="delEv('${ev.id}')">✕</button>`:''}
    </div>`).join('');
}

window.delEv=async id=>{sync('syncing');await remove(ref(db,'events/'+id));};
window.setPrio=p=>{prio=p;['High','Med','Low'].forEach(x=>document.getElementById('prio'+x).classList.toggle('active',x.toLowerCase()===p));};
window.saveEvent=async()=>{
  const t=document.getElementById('pTitle').value.trim();
  if(!t||!selDate){document.getElementById('pTitle').focus();return;}
  sync('syncing');
  await push(evRef,{date:dk(selDate),user:ME,title:t,from:document.getElementById('pFrom').value,to:document.getElementById('pTo').value,prio});
  document.getElementById('panelForm').classList.remove('visible');
  document.getElementById('btnShowForm').textContent='+ eintrag hinzufügen';
  document.getElementById('pTitle').value='';
};

function renderConflicts(){
  const el=document.getElementById('conflictList');
  const ws=new Date(now); ws.setDate(now.getDate()-now.getDay()+1);
  const we=new Date(ws); we.setDate(ws.getDate()+6);
  const wevs=list().filter(e=>{const d=new Date(e.date);return d>=ws&&d<=we;});
  const cs=[];
  for(let i=0;i<wevs.length;i++) for(let j=i+1;j<wevs.length;j++){
    const a=wevs[i],b=wevs[j];
    if(a.date===b.date&&a.user!==b.user&&a.from<b.to&&a.to>b.from) cs.push({a,b});
  }
  el.innerHTML=cs.length?cs.map(({a,b})=>`<div class="conflict-item">⚠️ ${a.date.slice(8)}. · ${a.from}–${a.to} vs ${b.from}–${b.to}</div>`).join(''):'<p class="no-data">keine 🎉</p>';
}

function renderUpcoming(){
  const el=document.getElementById('upcomingList');
  const tk=dk(now);
  const up=list().filter(e=>e.date>=tk).sort((a,b)=>a.date.localeCompare(b.date)||a.from.localeCompare(b.from)).slice(0,5);
  if(!up.length){el.innerHTML='<p class="no-data">noch nichts</p>';return;}
  el.innerHTML=up.map(ev=>{
    const [y,m,d]=ev.date.split('-');
    const ds=new Date(+y,+m-1,+d).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
    const col=ev.user===ME?'var(--acc-light)':'var(--mama)';
    return `<div class="upcoming-item"><div class="up-date">${ds}</div><div><div class="up-title">${ev.title}</div><div class="up-time" style="color:${col}">${ev.user} · ${ev.from}–${ev.to}</div></div></div>`;
  }).join('');
}

document.getElementById('prevMonth').onclick=()=>{mo--;if(mo<0){mo=11;yr--;}render();};
document.getElementById('nextMonth').onclick=()=>{mo++;if(mo>11){mo=0;yr++;}render();};
document.getElementById('todayBtn').onclick=()=>{yr=now.getFullYear();mo=now.getMonth();render();};
</script>
</body>
</html>
