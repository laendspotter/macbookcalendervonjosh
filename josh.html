<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josh · MacBook Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #10101c;
    --surface2: #18182a;
    --border: #22223a;
    --text: #e2e0ff;
    --muted: #5a5880;
    --josh: #7c6ff7;
    --josh-light: #a99fff;
    --josh-bg: rgba(124,111,247,0.1);
    --josh-border: rgba(124,111,247,0.3);
    --mama: #f472b6;
    --mama-bg: rgba(244,114,182,0.08);
    --mama-border: rgba(244,114,182,0.25);
    --high: #ff6b6b;
    --med: #60a5fa;
    --low: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  @keyframes loadbar { 0%{transform:scaleX(0);transform-origin:left;} 100%{transform:scaleX(1);transform-origin:left;opacity:0;} }

  body { font-family:'Syne Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; }
  body::after {
    content:''; position:fixed; top:-30vh; left:-20vw; width:70vw; height:70vh;
    background:radial-gradient(ellipse, rgba(124,111,247,0.08) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }

  .app { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:2.5rem 1.2rem; animation:fadeUp 0.5s ease both; }

  .loading-bar { position:fixed; top:0; left:0; right:0; height:2px; background:var(--josh); z-index:999; display:none; animation:loadbar 1.5s ease-in-out infinite; }
  .loading-bar.active { display:block; }

  .sync-indicator {
    position:fixed; bottom:1rem; right:1rem;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:20px; padding:0.4rem 0.8rem;
    font-size:0.62rem; color:var(--muted);
    display:flex; align-items:center; gap:0.4rem; z-index:50;
  }
  .sync-dot { width:6px; height:6px; border-radius:50%; background:var(--low); }
  .sync-dot.syncing { background:var(--josh); animation:pulse 1s infinite; }
  .sync-dot.offline { background:var(--high); }

  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
  .title-block h1 { font-family:'Syne',sans-serif; font-size:clamp(2.8rem,8vw,5rem); font-weight:800; line-height:0.9; letter-spacing:-0.04em; }
  .title-block h1 .accent { color:var(--josh); display:block; }
  .title-block p { font-size:0.65rem; color:var(--muted); margin-top:0.6rem; letter-spacing:0.15em; text-transform:uppercase; }

  .who-strip { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
  .badge { padding:0.35rem 0.9rem; border-radius:20px; font-size:0.68rem; letter-spacing:0.06em; font-family:'Syne Mono',monospace; }
  .badge.josh { background:var(--josh-bg); color:var(--josh-light); border:1px solid var(--josh-border); }
  .badge.mama { background:var(--mama-bg); color:var(--mama); border:1px solid var(--mama-border); }
  .badge.you  { background:rgba(124,111,247,0.2); color:#fff; border:1px solid var(--josh); font-weight:700; }

  .nav { display:flex; align-items:center; gap:0.8rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .nav-arrow { background:var(--surface); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
  .nav-arrow:hover { border-color:var(--josh); color:var(--josh); }
  .month-label { font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:700; letter-spacing:-0.01em; min-width:180px; }
  .today-btn { margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--muted); padding:0.35rem 0.8rem; border-radius:8px; font-family:'Syne Mono',monospace; font-size:0.65rem; cursor:pointer; letter-spacing:0.08em; text-transform:uppercase; transition:all 0.15s; }
  .today-btn:hover { border-color:var(--josh); color:var(--josh); }

  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:2rem; }
  .day-label { text-align:center; font-size:0.6rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; padding:0.4rem 0; }
  .day-cell { background:var(--surface); border:1px solid var(--border); border-radius:10px; min-height:88px; padding:0.45rem; cursor:pointer; transition:border-color 0.15s,background 0.15s; overflow:hidden; }
  @media(max-width:580px){.day-cell{min-height:58px;padding:0.3rem;}}
  .day-cell:hover { border-color:var(--josh); background:var(--surface2); }
  .day-cell.other-month { opacity:0.25; }
  .day-cell.today { border-color:var(--josh); box-shadow:0 0 0 1px var(--josh); }
  .day-num { font-size:0.7rem; color:var(--muted); margin-bottom:0.25rem; font-weight:500; }
  .today .day-num { color:var(--josh-light); font-weight:700; }

  .event-chip { font-size:0.56rem; padding:2px 5px; border-radius:4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:3px; cursor:pointer; transition:opacity 0.1s; }
  .event-chip:hover { opacity:0.75; }
  .event-chip.josh-ev { background:var(--josh-bg); border-left:2px solid var(--josh); color:var(--josh-light); }
  .event-chip.mama-ev { background:var(--mama-bg); border-left:2px solid var(--mama); color:var(--mama); }
  .prio-dot { width:4px; height:4px; border-radius:50%; flex-shrink:0; }

  .bottom-section { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media(max-width:580px){.bottom-section{grid-template-columns:1fr;}}
  .section-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.2rem; }
  .section-card h3 { font-size:0.62rem; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.9rem; font-family:'Syne',sans-serif; }
  .upcoming-item { display:flex; gap:0.7rem; align-items:flex-start; padding:0.55rem 0; border-bottom:1px solid var(--border); }
  .upcoming-item:last-child { border-bottom:none; }
  .upcoming-date { font-size:0.62rem; color:var(--muted); min-width:55px; line-height:1.5; }
  .upcoming-title { font-size:0.75rem; color:var(--text); }
  .upcoming-time { font-size:0.62rem; margin-top:1px; }
  .conflict-item { display:flex; gap:0.7rem; align-items:center; padding:0.55rem 0.75rem; background:rgba(255,107,107,0.06); border:1px solid rgba(255,107,107,0.15); border-radius:8px; margin-bottom:0.5rem; font-size:0.68rem; color:var(--high); }
  .no-data { font-size:0.7rem; color:var(--muted); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--surface2); border:1px solid var(--josh-border); border-radius:20px; padding:1.8rem; width:100%; max-width:400px; transform:scale(0.95); transition:transform 0.2s; box-shadow:0 0 60px rgba(124,111,247,0.15); }
  .modal-overlay.open .modal { transform:scale(1); }
  .modal h2 { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:800; margin-bottom:1.4rem; color:var(--text); }
  .modal h2 .sub { color:var(--josh); }
  .form-row { margin-bottom:1rem; }
  .form-row label { display:block; font-size:0.6rem; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.4rem; }
  .form-row input,.form-row select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:0.6rem 0.8rem; border-radius:10px; font-family:'Syne Mono',monospace; font-size:0.8rem; outline:none; transition:border-color 0.15s; }
  .form-row input:focus,.form-row select:focus { border-color:var(--josh); }
  .form-row select option { background:var(--surface2); }
  .time-row { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
  .prio-selector { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5rem; }
  .prio-btn { padding:0.5rem 0.3rem; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'Syne Mono',monospace; font-size:0.65rem; cursor:pointer; transition:all 0.15s; text-align:center; }
  .prio-btn.active.high { background:rgba(255,107,107,0.12); border-color:var(--high); color:var(--high); }
  .prio-btn.active.med  { background:rgba(96,165,250,0.12); border-color:var(--med); color:var(--med); }
  .prio-btn.active.low  { background:rgba(52,211,153,0.12); border-color:var(--low); color:var(--low); }
  .modal-actions { display:flex; gap:0.7rem; margin-top:1.4rem; }
  .btn-cancel { flex:1; padding:0.7rem; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:10px; font-family:'Syne Mono',monospace; font-size:0.72rem; cursor:pointer; transition:all 0.15s; }
  .btn-cancel:hover { border-color:var(--muted); color:var(--text); }
  .btn-save { flex:2; padding:0.7rem; background:var(--josh); border:none; color:#fff; border-radius:10px; font-family:'Syne',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all 0.15s; }
  .btn-save:hover { background:var(--josh-light); color:var(--bg); }
  .btn-delete { padding:0.7rem 1rem; background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.25); color:var(--high); border-radius:10px; font-family:'Syne Mono',monospace; font-size:0.72rem; cursor:pointer; transition:all 0.15s; }
  .btn-delete:hover { background:rgba(255,107,107,0.18); }
  .detail-header { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem; }
  .detail-row { display:flex; align-items:center; gap:0.6rem; font-size:0.76rem; color:var(--muted); margin-bottom:0.5rem; }
  .detail-row .val { color:var(--text); }
  .readonly-note { font-size:0.65rem; color:var(--muted); text-align:center; margin-top:0.8rem; opacity:0.7; }
</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="sync-indicator" id="syncIndicator">
  <div class="sync-dot syncing" id="syncDot"></div>
  <span id="syncText">verbinde...</span>
</div>

<div class="app">
  <header>
    <div class="title-block">
      <h1>JOSH<span class="accent">.</span></h1>
      <p>macbook kalender · deine einträge</p>
    </div>
    <div class="who-strip">
      <div class="badge you">● du</div>
      <div class="badge josh">josh</div>
      <div class="badge mama">mama</div>
    </div>
  </header>
  <div class="nav">
    <button class="nav-arrow" id="prevMonth">◀</button>
    <button class="nav-arrow" id="nextMonth">▶</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="today-btn" id="todayBtn">heute</button>
  </div>
  <div class="cal-grid" id="calGrid">
    <div class="day-label">Mo</div><div class="day-label">Di</div><div class="day-label">Mi</div>
    <div class="day-label">Do</div><div class="day-label">Fr</div><div class="day-label">Sa</div><div class="day-label">So</div>
  </div>
  <div class="bottom-section">
    <div class="section-card"><h3>⚡ konflikte diese woche</h3><div id="conflictList"><p class="no-data">keine überschneidungen 🎉</p></div></div>
    <div class="section-card"><h3>📅 nächste termine</h3><div id="upcomingList"><p class="no-data">noch nichts eingetragen</p></div></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>neuer eintrag <span class="sub" id="modalDateLabel"></span></h2>
    <div class="form-row"><label>was machst du?</label><input type="text" id="eventTitle" placeholder="z.b. zoom call, gaming, hausaufgaben..." /></div>
    <div class="form-row time-row">
      <div><label>von</label><input type="time" id="timeFrom" value="09:00" /></div>
      <div><label>bis</label><input type="time" id="timeTo" value="10:00" /></div>
    </div>
    <div class="form-row">
      <label>priorität</label>
      <div class="prio-selector">
        <button class="prio-btn high active" id="prioHigh" onclick="selectPrio('high')">🔴 dringend</button>
        <button class="prio-btn med" id="prioMed" onclick="selectPrio('med')">🔵 normal</button>
        <button class="prio-btn low" id="prioLow" onclick="selectPrio('low')">🟢 easy</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">cancel</button>
      <button class="btn-save" onclick="saveEvent()">eintragen ✓</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle">–</h2>
    <div class="detail-header">
      <div class="badge" id="detailUserBadge"></div>
      <div id="detailPrioBadge" style="padding:0.35rem 0.9rem;border-radius:20px;font-size:0.68rem;font-family:'Syne Mono',monospace;"></div>
    </div>
    <div class="detail-row"><span>🕐</span><span class="val" id="detailTime">–</span></div>
    <div class="detail-row"><span>📅</span><span class="val" id="detailDate">–</span></div>
    <div class="modal-actions" id="detailActions"></div>
    <p class="readonly-note" id="readonlyNote" style="display:none">mamas eintrag – kannst du nicht löschen</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCSVAnfWbMkmh8iExGit9VPiXyH7u0RuQ4",
    authDomain: "macbookcalender.firebaseapp.com",
    databaseURL: "https://macbookcalender-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "macbookcalender",
    storageBucket: "macbookcalender.firebasestorage.app",
    messagingSenderId: "343397183596",
    appId: "1:343397183596:web:12e6bc9f83ee3dcdd9e849"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const eventsRef = ref(db, 'events');

  const ME = 'josh';
  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth();
  let selectedPrio = 'high';
  let selectedDate = null;
  let detailEventId = null;
  let detailEventUser = null;
  let allEvents = {};

  const prioColors = { high: '#ff6b6b', med: '#60a5fa', low: '#34d399' };
  const prioLabels = { high: '🔴 dringend', med: '🔵 normal', low: '🟢 easy' };

  function setSync(state) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'offline' ? ' offline' : '');
    txt.textContent = state === 'syncing' ? 'syncing...' : state === 'offline' ? 'offline' : 'live ✓';
  }

  onValue(eventsRef, snap => {
    allEvents = snap.val() || {};
    setSync('online');
    render();
  }, () => setSync('offline'));

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getList() {
    return Object.entries(allEvents).map(([id, ev]) => ({ id, ...ev }));
  }

  function render() {
    const grid = document.getElementById('calGrid');
    const labels = [...grid.querySelectorAll('.day-label')];
    grid.innerHTML = ''; labels.forEach(l => grid.appendChild(l));

    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay  = new Date(currentYear, currentMonth + 1, 0);
    let offset = firstDay.getDay() - 1; if (offset < 0) offset = 6;

    for (let i = offset - 1; i >= 0; i--) grid.appendChild(makeCell(new Date(currentYear, currentMonth, -i), true));
    for (let d = 1; d <= lastDay.getDate(); d++) grid.appendChild(makeCell(new Date(currentYear, currentMonth, d), false));
    const total = offset + lastDay.getDate();
    const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let d = 1; d <= rem; d++) grid.appendChild(makeCell(new Date(currentYear, currentMonth + 1, d), true));

    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    document.getElementById('monthLabel').textContent = months[currentMonth] + ' ' + currentYear;
    renderConflicts(); renderUpcoming();
  }

  function makeCell(date, otherMonth) {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (otherMonth ? ' other-month' : '');
    if (dateKey(date) === dateKey(now)) cell.classList.add('today');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = date.getDate();
    cell.appendChild(num);

    const key = dateKey(date);
    const dayEvs = getList().filter(e => e.date === key).sort((a,b) => a.from.localeCompare(b.from));

    dayEvs.slice(0, 3).forEach(ev => {
      const chip = document.createElement('div');
      chip.className = 'event-chip ' + (ev.user === ME ? 'josh-ev' : 'mama-ev');
      chip.innerHTML = `<span class="prio-dot" style="background:${prioColors[ev.prio]}"></span>${ev.from} ${ev.title}`;
      chip.onclick = e => { e.stopPropagation(); openDetail(ev.id); };
      cell.appendChild(chip);
    });

    if (dayEvs.length > 3) {
      const more = document.createElement('div');
      more.style.cssText = 'font-size:0.52rem;color:var(--muted);margin-top:2px';
      more.textContent = `+${dayEvs.length - 3} mehr`;
      cell.appendChild(more);
    }

    cell.onclick = () => openAdd(date);
    return cell;
  }

  function openAdd(date) {
    selectedDate = date; selectedPrio = 'high';
    document.getElementById('eventTitle').value = '';
    document.getElementById('timeFrom').value = '09:00';
    document.getElementById('timeTo').value = '10:00';
    window.selectPrio('high');
    document.getElementById('modalDateLabel').textContent = date.toLocaleDateString('de-DE', { day:'numeric', month:'long' });
    document.getElementById('addModal').classList.add('open');
  }

  window.closeModal = () => document.getElementById('addModal').classList.remove('open');

  window.selectPrio = p => {
    selectedPrio = p;
    ['High','Med','Low'].forEach(x => document.getElementById('prio'+x).classList.toggle('active', x.toLowerCase() === p));
  };

  window.saveEvent = async () => {
    const title = document.getElementById('eventTitle').value.trim();
    if (!title) { document.getElementById('eventTitle').focus(); return; }
    setSync('syncing');
    await push(eventsRef, {
      date: dateKey(selectedDate), user: ME, title,
      from: document.getElementById('timeFrom').value,
      to: document.getElementById('timeTo').value,
      prio: selectedPrio
    });
    window.closeModal();
  };

  function openDetail(id) {
    const ev = getList().find(e => e.id === id);
    if (!ev) return;
    detailEventId = id; detailEventUser = ev.user;

    document.getElementById('detailTitle').textContent = ev.title;
    const badge = document.getElementById('detailUserBadge');
    badge.className = 'badge ' + ev.user;
    badge.textContent = ev.user === ME ? '🎮 josh' : '👩 mama';

    const pb = document.getElementById('detailPrioBadge');
    pb.textContent = prioLabels[ev.prio];
    pb.style.cssText = `padding:0.35rem 0.9rem;border-radius:20px;font-size:0.68rem;font-family:'Syne Mono',monospace;background:${ev.prio==='high'?'rgba(255,107,107,0.1)':ev.prio==='med'?'rgba(96,165,250,0.1)':'rgba(52,211,153,0.1)'};color:${prioColors[ev.prio]};border:1px solid ${ev.prio==='high'?'rgba(255,107,107,0.3)':ev.prio==='med'?'rgba(96,165,250,0.3)':'rgba(52,211,153,0.3)'}`;

    document.getElementById('detailTime').textContent = ev.from + ' – ' + ev.to + ' uhr';
    const [y,m,d] = ev.date.split('-');
    document.getElementById('detailDate').textContent = new Date(+y,+m-1,+d).toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    const actions = document.getElementById('detailActions');
    const note = document.getElementById('readonlyNote');
    if (ev.user === ME) {
      actions.innerHTML = `<button class="btn-delete" onclick="deleteEvent()">löschen</button><button class="btn-cancel" onclick="closeDetailModal()">schließen</button>`;
      note.style.display = 'none';
    } else {
      actions.innerHTML = `<button class="btn-cancel" style="flex:1" onclick="closeDetailModal()">schließen</button>`;
      note.style.display = 'block';
    }
    document.getElementById('detailModal').classList.add('open');
  }

  window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('open');

  window.deleteEvent = async () => {
    if (detailEventUser !== ME) return;
    setSync('syncing');
    await remove(ref(db, 'events/' + detailEventId));
    window.closeDetailModal();
  };

  function renderConflicts() {
    const list = document.getElementById('conflictList');
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
    const wEvs = getList().filter(e => { const d = new Date(e.date); return d >= weekStart && d <= weekEnd; });
    const conflicts = [];
    for (let i = 0; i < wEvs.length; i++)
      for (let j = i+1; j < wEvs.length; j++) {
        const a = wEvs[i], b = wEvs[j];
        if (a.date === b.date && a.user !== b.user && a.from < b.to && a.to > b.from) conflicts.push({a,b});
      }
    if (!conflicts.length) { list.innerHTML = '<p class="no-data">keine überschneidungen 🎉</p>'; return; }
    list.innerHTML = conflicts.map(({a,b}) => `<div class="conflict-item">⚠️ ${a.date.slice(8)}. · ${a.from}–${a.to} vs ${b.from}–${b.to}</div>`).join('');
  }

  function renderUpcoming() {
    const list = document.getElementById('upcomingList');
    const todayKey = dateKey(now);
    const upcoming = getList().filter(e => e.date >= todayKey).sort((a,b) => a.date.localeCompare(b.date)||a.from.localeCompare(b.from)).slice(0,5);
    if (!upcoming.length) { list.innerHTML = '<p class="no-data">noch nichts eingetragen</p>'; return; }
    list.innerHTML = upcoming.map(ev => {
      const [y,m,d] = ev.date.split('-');
      const ds = new Date(+y,+m-1,+d).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
      const col = ev.user === ME ? 'var(--josh-light)' : 'var(--mama)';
      return `<div class="upcoming-item"><div class="upcoming-date">${ds}</div><div><div class="upcoming-title">${ev.title}</div><div class="upcoming-time" style="color:${col}">${ev.user} · ${ev.from}–${ev.to}</div></div></div>`;
    }).join('');
  }

  document.getElementById('prevMonth').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} render(); };
  document.getElementById('nextMonth').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} render(); };
  document.getElementById('todayBtn').onclick   = () => { currentYear=now.getFullYear(); currentMonth=now.getMonth(); render(); };
  document.getElementById('addModal').onclick   = e => { if(e.target.id==='addModal') window.closeModal(); };
  document.getElementById('detailModal').onclick = e => { if(e.target.id==='detailModal') window.closeDetailModal(); };
</script>
</body>
</html>
