<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mama · Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf9f5;--surface:#fff;--surface2:#fef3ec;--surface3:#fdeee4;--border:#e8ddd5;
    --text:#2d2520;--muted:#a0897a;
    --acc:#d4507a;--acc-l:#e8789a;--acc-bg:rgba(212,80,122,.07);--acc-br:rgba(212,80,122,.25);
    --josh:#6054c8;--josh-bg:rgba(96,84,200,.07);--josh-br:rgba(96,84,200,.2);
    --high:#e05c3a;--med:#4a90d9;--low:#3aaa6e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes formIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;bottom:-10vh;right:-10vw;width:50vw;height:50vh;background:radial-gradient(ellipse,rgba(212,80,122,.06) 0%,transparent 70%);pointer-events:none;}

  .wrap{max-width:1100px;margin:0 auto;padding:2.5rem 1.2rem;animation:fadeUp .45s ease both;}

  .sync{position:fixed;bottom:1rem;right:1rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.4rem .9rem;font-size:.62rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--low);}
  .sdot.syn{background:var(--acc);animation:pulse 1s infinite;}
  .sdot.off{background:var(--high);}

  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,7vw,4.2rem);font-weight:400;line-height:.95;letter-spacing:-.02em;}
  h1 em{font-style:italic;color:var(--acc);}
  .sub{font-size:.68rem;color:var(--muted);margin-top:.5rem;letter-spacing:.1em;text-transform:uppercase;font-weight:300;}
  .badges{display:flex;gap:.5rem;flex-wrap:wrap;}
  .badge{padding:.3rem .85rem;border-radius:20px;font-size:.66rem;letter-spacing:.04em;}
  .badge.me{background:var(--acc);color:#fff;font-weight:500;}
  .badge.bm{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc-br);}
  .badge.bj{background:var(--josh-bg);color:var(--josh);border:1px solid var(--josh-br);}

  .nav{display:flex;align-items:center;gap:.7rem;margin-bottom:1.1rem;}
  .arr{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;box-shadow:0 1px 3px rgba(0,0,0,.05);touch-action:manipulation;}
  .arr:hover{border-color:var(--acc);color:var(--acc);}
  .mlabel{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;flex:1;}
  .tbtn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem .75rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.66rem;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:border-color .15s,color .15s;touch-action:manipulation;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);}

  .layout{display:grid;grid-template-columns:1fr;gap:1rem;}
  .layout.open{grid-template-columns:1fr 340px;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.4rem;}
  .dlbl{text-align:center;font-size:.62rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;padding:.35rem 0;font-weight:500;}
  .dcell{background:var(--surface);border:1px solid var(--border);border-radius:9px;min-height:86px;padding:.42rem;cursor:pointer;overflow:hidden;touch-action:manipulation;transition:border-color .12s,background .12s;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .dcell:hover,.dcell:active{border-color:var(--acc);}
  .dcell.dim{opacity:.28;background:var(--bg);box-shadow:none;pointer-events:none;}
  .dcell.today{border-color:var(--acc);box-shadow:0 0 0 2px rgba(212,80,122,.12);}
  .dcell.sel{border-color:var(--acc);background:var(--surface3);box-shadow:0 0 0 2px var(--acc);}
  .dnum{font-family:'Playfair Display',serif;font-size:.88rem;color:var(--muted);margin-bottom:.2rem;}
  .today .dnum,.sel .dnum{color:var(--acc);font-weight:700;}
  .chip{font-size:.54rem;padding:2px 4px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;}
  .chip.cm{background:var(--acc-bg);border-left:2px solid var(--acc);color:var(--acc);}
  .chip.cj{background:var(--josh-bg);border-left:2px solid var(--josh);color:var(--josh);}
  .pdot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
  .more{font-size:.5rem;color:var(--muted);margin-top:2px;}

  #overlay{display:none;position:fixed;inset:0;z-index:150;pointer-events:none;}
  #overlay.on{pointer-events:auto;}
  @media(max-width:720px){
    #overlay.on{display:block;background:rgba(45,37,32,.5);}
  }

  #panel{background:var(--surface);border:1px solid var(--acc-br);border-radius:16px;padding:1.4rem;box-shadow:0 8px 40px rgba(212,80,122,.1);display:none;overflow-y:auto;max-height:calc(100vh - 4rem);position:sticky;top:1rem;}
  #panel.on{display:block;}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.2rem;}
  .pdate{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--acc);font-style:italic;}
  .pwd{font-size:.6rem;color:var(--muted);margin-top:3px;letter-spacing:.06em;}
  #btnClose{background:var(--bg);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:manipulation;transition:border-color .15s,color .15s;}
  #btnClose:hover{border-color:var(--acc);color:var(--acc);}

  .slbl{font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem;font-weight:500;}
  #evList .empty{font-size:.7rem;color:var(--muted);padding:.3rem 0;}
  .pev{display:flex;gap:.65rem;align-items:flex-start;padding:.7rem .8rem;border-radius:9px;margin-bottom:.45rem;border:1px solid;}
  .pev.cm{background:var(--acc-bg);border-color:var(--acc-br);}
  .pev.cj{background:var(--josh-bg);border-color:var(--josh-br);}
  .ptime{font-size:.63rem;color:var(--muted);min-width:68px;line-height:1.6;white-space:nowrap;}
  .pinfo{flex:1;}
  .ptitle{font-size:.82rem;color:var(--text);font-weight:500;margin-bottom:2px;}
  .pwho{font-size:.6rem;}
  .pev.cm .pwho{color:var(--acc);}
  .pev.cj .pwho{color:var(--josh);}
  .pdel{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:.2rem;align-self:flex-start;line-height:1;touch-action:manipulation;transition:color .1s;}
  .pdel:hover{color:var(--high);}

  #btnAdd{width:100%;padding:.7rem;margin-top:.9rem;background:transparent;border:1px dashed var(--acc-br);color:var(--acc);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.76rem;cursor:pointer;transition:background .15s,border-style .15s;touch-action:manipulation;}
  #btnAdd:hover,#btnAdd:active{background:var(--acc-bg);border-style:solid;}

  #addForm{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);display:none;animation:formIn .2s ease both;}
  #addForm.on{display:block;}
  .ftitle{font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem;font-weight:500;}
  .fstack{display:flex;flex-direction:column;gap:.65rem;}
  .frow label{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-bottom:.28rem;font-weight:500;}
  .frow input,.frow select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.52rem .65rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none;}
  .frow input:focus,.frow select:focus{border-color:var(--acc);}
  .tworow{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;}
  .prios{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;}
  .pr{padding:.48rem .1rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.65rem;cursor:pointer;text-align:center;transition:all .15s;touch-action:manipulation;}
  .pr.on.h{background:rgba(224,92,58,.08);border-color:var(--high);color:var(--high);}
  .pr.on.m{background:rgba(74,144,217,.08);border-color:var(--med);color:var(--med);}
  .pr.on.l{background:rgba(58,170,110,.08);border-color:var(--low);color:var(--low);}
  .fbtns{display:flex;gap:.55rem;margin-top:.7rem;}
  #btnCancel{flex:1;padding:.68rem;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.76rem;cursor:pointer;touch-action:manipulation;}
  #btnSave{flex:2;padding:.68rem;background:var(--acc);border:none;color:#fff;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;touch-action:manipulation;}
  #btnSave:active{opacity:.85;}

  .bottom{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:1.1rem;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .card h3{font-size:.6rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.85rem;font-weight:500;}
  .uitem{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--border);}
  .uitem:last-child{border-bottom:none;}
  .udt{font-size:.6rem;color:var(--muted);min-width:52px;line-height:1.5;}
  .utitle{font-size:.76rem;color:var(--text);}
  .utime{font-size:.6rem;margin-top:1px;}
  .conf{display:flex;gap:.6rem;align-items:center;padding:.5rem .7rem;background:rgba(224,92,58,.06);border:1px solid rgba(224,92,58,.15);border-radius:8px;margin-bottom:.45rem;font-size:.66rem;color:var(--high);}
  .empty2{font-size:.68rem;color:var(--muted);}

  @media(max-width:720px){
    .wrap{padding:1rem .75rem 5rem;}
    header{margin-bottom:1rem;}
    h1{font-size:2rem;}
    .badges{display:none;}
    .nav{gap:.4rem;margin-bottom:.7rem;}
    .mlabel{font-size:.9rem;}
    .arr{width:32px;height:32px;}
    .tbtn{font-size:.58rem;padding:.28rem .55rem;}
    .grid{gap:2px;}
    .dlbl{font-size:.5rem;padding:.28rem 0;}
    .dcell{min-height:52px;padding:.28rem;border-radius:6px;}
    .dnum{font-size:.72rem;}
    .chip{font-size:.48rem;padding:1px 3px;}
    .more{font-size:.44rem;}
    .bottom{grid-template-columns:1fr;gap:.55rem;}
    .card{padding:.85rem;}

    .layout.open{grid-template-columns:1fr;}
    #panel{
      position:fixed !important;
      inset:auto 0 0 0 !important;
      width:100% !important;max-height:83vh !important;
      border-radius:18px 18px 0 0 !important;
      z-index:200 !important;
      overflow-y:auto !important;-webkit-overflow-scrolling:touch;
      padding:.4rem 1rem 2.5rem !important;
      border:1px solid var(--acc-br) !important;border-bottom:none !important;
      animation:slideUp .28s ease both !important;
    }
    #panel.on{display:block !important;}
    .handle{display:block !important;}
    .pdate{font-size:.98rem;}
    #btnClose{width:36px;height:36px;}
    .pev{padding:.58rem .65rem;}
    .ptitle{font-size:.78rem;}
    .ptime{font-size:.6rem;min-width:58px;}
    #btnAdd{padding:.65rem;font-size:.72rem;margin-top:.75rem;}
    .frow input,.frow select{font-size:16px !important;}
    .pr{font-size:.6rem;padding:.48rem .05rem;}
    .fbtns{gap:.45rem;}
    #btnCancel,#btnSave{padding:.72rem;font-size:.75rem;}
  }
</style>
</head>
<body>

<div class="sync" id="sync"><div class="sdot syn" id="sdot"></div><span id="stxt">verbinde...</span></div>
<div id="overlay"></div>

<div class="wrap">
  <header>
    <div>
      <h1><em>Mama</em></h1>
      <p class="sub">macbook kalender · deine einträge</p>
    </div>
    <div class="badges">
      <span class="badge me">● du</span>
      <span class="badge bm">mama</span>
      <span class="badge bj">josh</span>
    </div>
  </header>

  <div class="nav">
    <button class="arr" id="btnPrev">◀</button>
    <button class="arr" id="btnNext">▶</button>
    <span class="mlabel" id="mlabel"></span>
    <button class="tbtn" id="btnToday">heute</button>
  </div>

  <div class="layout" id="layout">
    <div>
      <div class="grid" id="grid">
        <div class="dlbl">Mo</div><div class="dlbl">Di</div><div class="dlbl">Mi</div>
        <div class="dlbl">Do</div><div class="dlbl">Fr</div><div class="dlbl">Sa</div><div class="dlbl">So</div>
      </div>
      <div class="bottom">
        <div class="card"><h3>⚡ konflikte</h3><div id="confl"><p class="empty2">keine 🎉</p></div></div>
        <div class="card"><h3>📅 nächste termine</h3><div id="upc"><p class="empty2">noch nichts</p></div></div>
      </div>
    </div>

    <div id="panel">
      <div class="handle" style="display:none;width:38px;height:4px;background:rgba(212,80,122,.2);border-radius:2px;margin:0 auto .9rem;"></div>
      <div class="phead">
        <div><div class="pdate" id="pdate">–</div><div class="pwd" id="pwd"></div></div>
        <button id="btnClose">✕</button>
      </div>
      <div class="slbl">einträge an diesem tag</div>
      <div id="evList"><p class="empty">noch nichts geplant ✨</p></div>
      <button id="btnAdd">+ eintrag hinzufügen</button>
      <div id="addForm">
        <div class="ftitle">neuer eintrag</div>
        <div class="fstack">
          <div class="frow"><label>was machst du?</label><input type="text" id="ftitle" placeholder="z.b. videocall, arzttermin..." autocomplete="off"></div>
          <div class="frow tworow">
            <div><label>von</label><input type="time" id="ffrom" value="09:00"></div>
            <div><label>bis</label><input type="time" id="fto" value="10:00"></div>
          </div>
          <div class="frow">
            <label>priorität</label>
            <div class="prios">
              <button class="pr h on" data-p="high">🔴 dringend</button>
              <button class="pr m" data-p="med">🔵 normal</button>
              <button class="pr l" data-p="low">🟢 entspannt</button>
            </div>
          </div>
          <div class="fbtns">
            <button id="btnCancel">abbrechen</button>
            <button id="btnSave">eintragen ✓</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCSVAnfWbMkmh8iExGit9VPiXyH7u0RuQ4",
  authDomain:"macbookcalender.firebaseapp.com",
  databaseURL:"https://macbookcalender-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"macbookcalender",
  storageBucket:"macbookcalender.firebasestorage.app",
  messagingSenderId:"343397183596",
  appId:"1:343397183596:web:12e6bc9f83ee3dcdd9e849"
});
const db = getDatabase(app);
const evRef = ref(db,'events');

const ME = 'mama';
const now = new Date();
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const PC={high:'#e05c3a',med:'#4a90d9',low:'#3aaa6e'};
const PL={high:'🔴 dringend',med:'🔵 normal',low:'🟢 entspannt'};

let yr=now.getFullYear(), mo=now.getMonth(), selDate=null, curPrio='high', evs={};
const $=id=>document.getElementById(id);
const grid=$('grid');

function setSyn(s){$('sdot').className='sdot'+(s==='syn'?' syn':s==='off'?' off':'');$('stxt').textContent=s==='syn'?'syncing...':s==='off'?'offline':'live ✓';}
onValue(evRef,snap=>{evs=snap.val()||{};setSyn('ok');render();if(selDate)renderPanel(selDate);},()=>setSyn('off'));
function dk(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function allEvs(){return Object.entries(evs).map(([id,e])=>({id,...e}));}

function render(){
  const labels=[...grid.querySelectorAll('.dlbl')];
  grid.innerHTML=''; labels.forEach(l=>grid.appendChild(l));
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);
  let off=first.getDay()-1; if(off<0)off=6;
  for(let i=off-1;i>=0;i--) grid.appendChild(mkCell(new Date(yr,mo,-i),true));
  for(let d=1;d<=last.getDate();d++) grid.appendChild(mkCell(new Date(yr,mo,d),false));
  const tot=off+last.getDate(),rem=tot%7===0?0:7-(tot%7);
  for(let d=1;d<=rem;d++) grid.appendChild(mkCell(new Date(yr,mo+1,d),true));
  $('mlabel').textContent=MONTHS[mo]+' '+yr;
  renderConf(); renderUpc();
}

function mkCell(date,dim){
  const c=document.createElement('div');
  c.className='dcell'+(dim?' dim':'');
  const key=dk(date);
  if(key===dk(now)) c.classList.add('today');
  if(selDate&&key===dk(selDate)) c.classList.add('sel');
  const n=document.createElement('div'); n.className='dnum'; n.textContent=date.getDate(); c.appendChild(n);
  const dayEvs=allEvs().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  dayEvs.slice(0,2).forEach(ev=>{
    const ch=document.createElement('div');
    ch.className='chip '+(ev.user===ME?'cm':'cj');
    ch.innerHTML=`<span class="pdot" style="background:${PC[ev.prio]}"></span>${ev.from} ${ev.title}`;
    c.appendChild(ch);
  });
  if(dayEvs.length>2){const m=document.createElement('div');m.className='more';m.textContent=`+${dayEvs.length-2} mehr`;c.appendChild(m);}
  c.addEventListener('click',()=>openDay(date));
  return c;
}

function openDay(date){
  selDate=date;
  closeForm(false);
  $('layout').classList.add('open');
  $('panel').classList.add('on');
  $('overlay').classList.add('on');
  renderPanel(date); render();
}
function closePanel(){
  selDate=null;
  $('layout').classList.remove('open');
  $('panel').classList.remove('on');
  $('overlay').classList.remove('on');
  closeForm(false); render();
}
function openForm(){
  $('addForm').classList.add('on');
  $('btnAdd').textContent='✕ abbrechen';
  $('ftitle').value=''; $('ffrom').value='09:00'; $('fto').value='10:00';
  setPrio('high');
  setTimeout(()=>$('ftitle').focus(),80);
}
function closeForm(resetBtn=true){
  $('addForm').classList.remove('on');
  if(resetBtn) $('btnAdd').textContent='+ eintrag hinzufügen';
}

function renderPanel(date){
  const key=dk(date),dayEvs=allEvs().filter(e=>e.date===key).sort((a,b)=>a.from.localeCompare(b.from));
  $('pdate').textContent=date.getDate()+'. '+MO[date.getMonth()];
  $('pwd').textContent=WD[date.getDay()];
  const el=$('evList');
  if(!dayEvs.length){el.innerHTML='<p class="empty">noch nichts geplant ✨</p>';return;}
  el.innerHTML=dayEvs.map(ev=>`
    <div class="pev ${ev.user===ME?'cm':'cj'}">
      <div class="ptime">${ev.from}–${ev.to}</div>
      <div class="pinfo"><div class="ptitle">${ev.title}</div><div class="pwho">${ev.user===ME?'👩 mama':'🎮 josh'} · ${PL[ev.prio]}</div></div>
      ${ev.user===ME?`<button class="pdel" data-id="${ev.id}">✕</button>`:''}
    </div>`).join('');
  el.querySelectorAll('.pdel').forEach(b=>b.addEventListener('click',async()=>{setSyn('syn');await remove(ref(db,'events/'+b.dataset.id));}));
}

function setPrio(p){
  curPrio=p;
  document.querySelectorAll('.pr').forEach(b=>{
    const bp=b.dataset.p;
    b.classList.remove('on');
    if(bp===p) b.classList.add('on');
  });
}

async function saveEv(){
  const t=$('ftitle').value.trim();
  if(!t||!selDate){$('ftitle').focus();return;}
  setSyn('syn');
  await push(evRef,{date:dk(selDate),user:ME,title:t,from:$('ffrom').value,to:$('fto').value,prio:curPrio});
  closeForm();
}

function renderConf(){
  const el=$('confl');
  const ws=new Date(now); ws.setDate(now.getDate()-now.getDay()+1);
  const we=new Date(ws); we.setDate(ws.getDate()+6);
  const wevs=allEvs().filter(e=>{const d=new Date(e.date);return d>=ws&&d<=we;});
  const cs=[];
  for(let i=0;i<wevs.length;i++) for(let j=i+1;j<wevs.length;j++){const a=wevs[i],b=wevs[j];if(a.date===b.date&&a.user!==b.user&&a.from<b.to&&a.to>b.from)cs.push({a,b});}
  el.innerHTML=cs.length?cs.map(({a,b})=>`<div class="conf">⚠️ ${a.date.slice(8)}. · ${a.from}–${a.to} vs ${b.from}–${b.to}</div>`).join(''):'<p class="empty2">keine 🎉</p>';
}
function renderUpc(){
  const el=$('upc'),tk=dk(now);
  const up=allEvs().filter(e=>e.date>=tk).sort((a,b)=>a.date.localeCompare(b.date)||a.from.localeCompare(b.from)).slice(0,5);
  if(!up.length){el.innerHTML='<p class="empty2">noch nichts</p>';return;}
  el.innerHTML=up.map(ev=>{const[y,m,d]=ev.date.split('-');const ds=new Date(+y,+m-1,+d).toLocaleDateString('de-DE',{day:'numeric',month:'short'});const col=ev.user===ME?'var(--acc)':'var(--josh)';return`<div class="uitem"><div class="udt">${ds}</div><div><div class="utitle">${ev.title}</div><div class="utime" style="color:${col}">${ev.user} · ${ev.from}–${ev.to}</div></div></div>`;}).join('');
}

$('btnPrev').addEventListener('click',()=>{mo--;if(mo<0){mo=11;yr--;}render();});
$('btnNext').addEventListener('click',()=>{mo++;if(mo>11){mo=0;yr++;}render();});
$('btnToday').addEventListener('click',()=>{yr=now.getFullYear();mo=now.getMonth();render();});
$('btnClose').addEventListener('click',closePanel);
$('overlay').addEventListener('click',closePanel);
$('btnAdd').addEventListener('click',()=>{if($('addForm').classList.contains('on'))closeForm();else openForm();});
$('btnCancel').addEventListener('click',closeForm);
$('btnSave').addEventListener('click',saveEv);
document.querySelectorAll('.pr').forEach(b=>b.addEventListener('click',()=>setPrio(b.dataset.p)));
</script>
