<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacBook Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080810;font-family:'Syne',sans-serif;padding:2rem;}

  #pwScreen{text-align:center;animation:fadeUp .5s ease both;}
  #pwScreen h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;color:#e2e0ff;letter-spacing:-.04em;margin-bottom:.4rem;}
  #pwScreen h1 em{font-family:'Playfair Display',serif;font-style:italic;color:#7c6ff7;}
  .hint{font-size:.7rem;color:#5a5880;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2.5rem;}

  .pw-box{display:inline-flex;flex-direction:column;align-items:center;gap:.9rem;background:#10101c;border:1px solid #22223a;border-radius:18px;padding:2rem 2.5rem;}
  .pw-label{font-size:.62rem;color:#5a5880;letter-spacing:.14em;text-transform:uppercase;}
  #pwInput{background:#080810;border:1px solid #22223a;color:#e2e0ff;padding:.7rem 1rem;border-radius:10px;font-family:'Syne',sans-serif;font-size:1rem;letter-spacing:.15em;text-align:center;outline:none;width:200px;transition:border-color .15s;}
  #pwInput:focus{border-color:#7c6ff7;}
  #pwInput.error{border-color:#ff6b6b;animation:shake .4s ease;}
  #pwBtn{width:200px;padding:.75rem;background:#7c6ff7;border:none;color:#fff;border-radius:10px;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:opacity .15s;touch-action:manipulation;}
  #pwBtn:hover{opacity:.88;}
  #pwBtn:active{opacity:.75;}
  .pw-err{font-size:.68rem;color:#ff6b6b;min-height:1rem;}

  #mainScreen{display:none;text-align:center;animation:fadeIn .4s ease both;}
  #mainScreen h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;color:#e2e0ff;letter-spacing:-.04em;margin-bottom:.4rem;}
  #mainScreen h1 em{font-family:'Playfair Display',serif;font-style:italic;color:#7c6ff7;}
  #mainScreen p{font-size:.72rem;color:#5a5880;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3rem;}

  .cards{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;}
  .card{width:200px;padding:2rem 1.5rem;border-radius:20px;border:1px solid;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;gap:.8rem;}
  .card:hover{transform:translateY(-5px);}
  .card.josh{background:rgba(124,111,247,.08);border-color:rgba(124,111,247,.3);box-shadow:0 0 40px rgba(124,111,247,.08);}
  .card.josh:hover{box-shadow:0 8px 40px rgba(124,111,247,.2);}
  .card.mama{background:rgba(212,80,122,.07);border-color:rgba(212,80,122,.25);box-shadow:0 0 40px rgba(212,80,122,.06);}
  .card.mama:hover{box-shadow:0 8px 40px rgba(212,80,122,.18);}
  .card.sam{background:rgba(79,126,247,.08);border-color:rgba(79,126,247,.3);box-shadow:0 0 40px rgba(79,126,247,.08);}
  .card.sam:hover{box-shadow:0 8px 40px rgba(79,126,247,.22);}
  .emoji{font-size:2.5rem;}
  .card-name{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;}
  .card.josh .card-name{color:#a99fff;}
  .card.mama .card-name{color:#f472b6;}
  .card.sam .card-name{color:#89a8ff;}
  .card-sub{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5880;}
</style>
</head>
<body>

<div id="pwScreen">
  <h1>mac<em>book</em></h1>
  <p class="hint">zugang · kalender</p>
  <div class="pw-box">
    <div class="pw-label">passwort eingeben</div>
    <input type="password" id="pwInput" placeholder="••••••••" autocomplete="off" autocapitalize="off">
    <button id="pwBtn">weiter →</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<div id="mainScreen">
  <h1>mac<em>book</em></h1>
  <p>wer bist du?</p>
  <div class="cards">
    <a class="card josh" href="josh.html"><div class="emoji">🎮</div><div class="card-name">Josh</div><div class="card-sub">dein kalender</div></a>
    <a class="card mama" href="mama.html"><div class="emoji">👩</div><div class="card-name">Mama</div><div class="card-sub">ihr kalender</div></a>
    <a class="card sam" href="sam.html"><div class="emoji">🎧</div><div class="card-name">Sam</div><div class="card-sub">sein kalender</div></a>
  </div>
</div>

<script>
  const PW = 'macbook';
  const input = document.getElementById('pwInput');
  const btn = document.getElementById('pwBtn');
  const err = document.getElementById('pwErr');

  if(sessionStorage.getItem('unlocked') === '1'){
    document.getElementById('pwScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
  }

  function tryLogin(){
    if(input.value === PW){
      sessionStorage.setItem('unlocked','1');
      document.getElementById('pwScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
    } else {
      err.textContent = 'falsches passwort ✕';
      input.classList.add('error');
      input.value = '';
      setTimeout(()=>{ input.classList.remove('error'); err.textContent=''; }, 1500);
      input.focus();
    }
  }

  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  input.focus();
</script>
</body>
</html>
